name: Release

# Pushing a v* tag builds the plugin for every platform in manifest.json and
# publishes a GitHub release with the binaries, their checksums and a manifest
# per platform. Install one in Silo with Admin > Plugins > Upload.
#
# Each binary also gets a signed build provenance attestation: who built it,
# from which commit, with this workflow. Check a download with
#   gh attestation verify plugin-linux-amd64 --repo Collisionc/silo-plugin-metadata-youtube
# The checksums only show a download is complete; the attestation shows where
# it came from.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write     # the release
  id-token: write     # signing the attestations
  attestations: write # storing them

# Actions are pinned to a release's commit, not its tag: a tag can be moved to
# other code later, a commit cannot. The comment names the release.
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          : > dist/checksums.txt
          for platform in linux/amd64 linux/arm64 darwin/arm64; do
            goos="${platform%%/*}" goarch="${platform##*/}"
            binary="plugin-${goos}-${goarch}"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="-s -w -X main.version=${version}" -o "dist/${binary}" .
            checksum=$(sha256sum "dist/${binary}" | awk '{print $1}')
            printf '%s  %s\n' "$checksum" "$binary" >> dist/checksums.txt
            jq --arg v "$version" --arg c "$checksum" '.version = $v | .checksum = $c' manifest.json > "dist/manifest-${goos}-${goarch}.json"
          done

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/plugin-*

      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
