name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to a release's commit, not its tag: a tag can be moved to
# other code later, a commit cannot. The comment names the release.
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Nothing here pushes: the token need not stay in .git/config.
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Reject committed local SDK replaces
        run: |
          if grep -Eq '^replace github.com/Silo-Server/silo-plugin-sdk => ' go.mod; then
            echo "go.mod replaces the SDK with a local checkout."
            exit 1
          fi

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      # Known vulnerabilities in the code paths the plugin actually calls, in
      # its modules and in the Go release that builds it (go.mod's toolchain).
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      # With the race detector: the plugin answers Silo's calls on many
      # goroutines over shared caches, and lists channels in the background.
      - name: Test
        run: go test -race ./...

      - name: Build
        run: make build-all
